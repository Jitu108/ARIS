name: Project - set In Progress on branch create

# GitHub Projects (v2) has no built-in "branch created" automation, so this
# workflow drives it manually: when a branch named "<issue-number>-..." is
# created, the linked project item's Status field is set to "In Progress".
on:
  create

jobs:
  set-in-progress:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number from branch name
        id: issue
        run: |
          branch="${{ github.event.ref }}"
          number=$(echo "$branch" | grep -oE '^[0-9]+' || true)
          if [ -z "$number" ]; then
            echo "Branch '$branch' has no leading issue number, skipping."
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Move linked project item to In Progress
        if: steps.issue.outputs.number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = parseInt('${{ steps.issue.outputs.number }}', 10);
            const projectNumber = parseInt('${{ vars.PROJECT_NUMBER }}', 10);
            const statusOptionName = 'In Progress';

            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$number) {
                    id
                    projectItems(first: 20) {
                      nodes {
                        id
                        project {
                          id
                          number
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            const result = await github.graphql(query, { owner, repo, number: issueNumber });
            const issue = result.repository.issue;

            if (!issue) {
              core.warning(`Issue #${issueNumber} not found, skipping.`);
              return;
            }

            const item = issue.projectItems.nodes.find(n => n.project.number === projectNumber);
            if (!item) {
              core.warning(`Issue #${issueNumber} is not on project #${projectNumber}, skipping.`);
              return;
            }

            const statusField = item.project.field;
            if (!statusField) {
              core.warning(`Project #${projectNumber} has no single-select "Status" field, skipping.`);
              return;
            }

            const option = statusField.options.find(o => o.name === statusOptionName);
            if (!option) {
              core.warning(`Status field has no "${statusOptionName}" option, skipping.`);
              return;
            }

            const mutation = `
              mutation($project:ID!, $item:ID!, $field:ID!, $value:String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project,
                  itemId: $item,
                  fieldId: $field,
                  value: { singleSelectOptionId: $value }
                }) {
                  projectV2Item { id }
                }
              }`;

            await github.graphql(mutation, {
              project: item.project.id,
              item: item.id,
              field: statusField.id,
              value: option.id,
            });

            core.info(`Issue #${issueNumber} moved to "${statusOptionName}".`);
