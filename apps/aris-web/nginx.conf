server {
    listen 80;
    server_name _;

    # Docker-network equivalent of proxy.conf.json's dev-server proxy — same relative-path,
    # no-hardcoded-API-host design, resolved via Compose's internal service DNS instead of
    # webpack-dev-server. Replace with the Ocelot gateway once it exists.
    location /identity/ {
        proxy_pass http://identity-service:8080/identity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
