<div class="login-page">
  <div class="login-column">
    <div class="brand">
      <div class="product-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M2 12h4l2-7 4 14 3-9 2 4h5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="wordmark">
        <div class="wordmark-title">ARIS</div>
        <div class="wordmark-subtitle">Agentic Risk Intelligence System</div>
      </div>
    </div>

    <form class="login-card" (ngSubmit)="handleSubmit()">
      <div class="card-heading">
        <div class="card-title">Sign in to ARIS</div>
        <div class="card-subtitle">Enter your credentials to continue.</div>
      </div>

      @if (errorMessage()) {
        <div class="error-banner">
          <app-icon name="alert-triangle" [size]="16" />
          <div>{{ errorMessage() }}</div>
        </div>
      }

      <div class="field">
        <label for="username">Username or email</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="e.g. m.chen"
          [class.field-error]="errorMessage()"
          [(ngModel)]="username"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-input">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            placeholder="Enter your password"
            [class.field-error]="errorMessage()"
            [(ngModel)]="password"
          />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </div>
      </div>

      <div class="forgot-password-row">
        <!-- Intentionally has no handler, matching the mockup exactly — /forgot-password isn't built yet. -->
        <button type="button" class="link-button">Forgot your password?</button>
      </div>

      <button type="submit" class="submit-button" [disabled]="submitting()">
        @if (submitting()) {
          <svg class="spinner" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2.5" stroke-opacity="0.3" />
            <path d="M21 12a9 9 0 0 0-9-9" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        }
        <span>{{ submitting() ? 'Signing in…' : 'Sign in' }}</span>
      </button>
    </form>

    <div class="footer">ARIS — Internal Clinical Platform</div>
  </div>
</div>
