<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root{
      --bg:#F3F5F7; --surface:#FFFFFF; --border:#DFE4EA; --border-strong:#C7CFD8;
      --text:#16202B; --text-2:#56677A; --text-3:#8A97A6;
      --accent:#0B6E8C; --accent-tint:#E5F1F5;
      --warn:#9A6B12; --warn-tint:#FBF2E2; --warn-border:#EAD3A0;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }
    button{ font-family:inherit; cursor:pointer; }
    button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
    .menu-btn:hover{ background:var(--accent-tint); }
    .menu-row:hover{ background:var(--accent-tint); }
    .nav-item:hover{ background:var(--accent-tint); }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">

  <div style="height:60px; flex-shrink:0; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:relative;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:28px; height:28px; border-radius:7px; background:var(--accent); display:flex; align-items:center; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 3-9 2 4h5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:15px; font-weight:700; letter-spacing:0.02em;">ARIS</div>
    </div>
    <div style="position:relative;">
      <button class="menu-btn" onClick="{{toggleMenu}}" style="display:flex; align-items:center; gap:10px; background:none; border:none; padding:6px 10px 6px 6px; border-radius:8px;">
        <div style="width:28px; height:28px; border-radius:999px; background:var(--accent-tint); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;">{{userInitials}}</div>
        <div style="display:flex; flex-direction:column; align-items:flex-start; gap:1px;">
          <div style="font-size:13px; font-weight:600; line-height:15px;">{{userName}}</div>
          <div style="font-size:11px; color:var(--text-2); line-height:13px;">{{roleLabel}}</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="color:var(--text-3);"><path d="M5 8l7 7 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
        <div style="position:absolute; top:44px; right:0; width:220px; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 20px rgba(16,24,32,0.14); padding:8px; z-index:20;">
          <div style="padding:6px 10px 10px;">
            <div style="font-size:13px; font-weight:600;">{{userName}}</div>
            <div style="font-size:11px; color:var(--text-2); margin-top:2px;">{{roleLabel}}</div>
          </div>
          <div style="height:1px; background:var(--border); margin:2px 0 6px;"></div>
          <div style="font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-3); padding:2px 10px 6px;">Preview as (prototype only)</div>
          <sc-for list="{{roleRows}}" as="row" hint-placeholder-count="6">
            <button class="menu-row" onClick="{{row.pick}}" style="width:100%; display:flex; align-items:center; justify-content:space-between; background:none; border:none; text-align:left; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--text);">
              <span>{{row.label}}</span>
              <sc-if value="{{row.isCurrent}}" hint-placeholder-val="{{false}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#0B6E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </sc-if>
            </button>
          </sc-for>
          <div style="height:1px; background:var(--border); margin:6px 0 4px;"></div>
          <button class="menu-row" onClick="{{toggleMenu}}" style="width:100%; text-align:left; background:none; border:none; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--text);">Log out</button>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="flex:1; display:flex; min-height:0;">
    <div style="width:232px; flex-shrink:0; border-right:1px solid var(--border); background:var(--surface); padding:16px 12px; display:flex; flex-direction:column; gap:4px;">
      <div class="nav-item" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; font-size:14px; font-weight:500; color:var(--text-2);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        Dashboard
      </div>
      <sc-if value="{{showPatientsNav}}" hint-placeholder-val="{{false}}">
        <div class="nav-item" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; font-size:14px; font-weight:500; color:var(--text-2);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M18.5 20v-1.5a3.5 3.5 0 0 0-2.3-3.29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14.7 5.13a3.5 3.5 0 0 1 0 6.74" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Patients
        </div>
      </sc-if>
      <sc-if value="{{showUsersNav}}" hint-placeholder-val="{{false}}">
        <div class="nav-item" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; font-size:14px; font-weight:500; color:var(--text-2);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="12" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 16.5c.5-1.6 1.8-2.5 3-2.5s2.5.9 3 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M14 11h4M14 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Users
        </div>
      </sc-if>
    </div>

    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; max-width:380px;">
        <div style="width:52px; height:52px; border-radius:999px; background:var(--warn-tint); border:1px solid var(--warn-border); display:flex; align-items:center; justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#9A6B12" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#9A6B12" stroke-width="1.7"/></svg>
        </div>
        <div style="font-size:18px; font-weight:600;">You don't have access to this page</div>
        <div style="font-size:13px; color:var(--text-2); line-height:19px;">Your role ({{roleLabel}}) doesn't include permission to view Patients. Contact an administrator if you believe this is incorrect.</div>
        <button style="margin-top:8px; height:38px; padding:0 18px; border-radius:6px; border:none; background:var(--accent); color:white; font-size:13px; font-weight:600;">Back to Dashboard</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
const ROLES = [
  { value: 'Administrator', label: 'Administrator', name: 'Dana Osei' },
  { value: 'Clinician', label: 'Clinician', name: 'Dr. Maya Chen' },
  { value: 'Coder', label: 'Coder', name: 'Priya Nair' },
  { value: 'RiskAnalyst', label: 'Risk Analyst', name: 'Sam Whitfield' },
  { value: 'Auditor', label: 'Auditor', name: 'Jordan Blake' },
  { value: 'Researcher', label: 'Researcher', name: 'Alex Kim' }
];
const PATIENT_NAV_ROLES = ['Administrator', 'Clinician', 'Coder', 'RiskAnalyst'];

function initialsFor(name) {
  const parts = name.split(' ').filter((p) => !p.endsWith('.'));
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (first + last).toUpperCase();
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'Auditor', menuOpen: false };
  }

  toggleMenu() { this.setState({ menuOpen: !this.state.menuOpen }); }
  pickRole(value) { this.setState({ role: value, menuOpen: false }); }

  renderVals() {
    const current = ROLES.find((r) => r.value === this.state.role) || ROLES[4];
    return {
      roleLabel: current.label,
      userName: current.name,
      userInitials: initialsFor(current.name),
      menuOpen: this.state.menuOpen,
      showPatientsNav: PATIENT_NAV_ROLES.indexOf(this.state.role) !== -1,
      showUsersNav: this.state.role === 'Administrator',
      toggleMenu: () => this.toggleMenu(),
      roleRows: ROLES.map((r) => ({ label: r.label, isCurrent: r.value === this.state.role, pick: () => this.pickRole(r.value) }))
    };
  }
}
</script>
</body>
</html>
