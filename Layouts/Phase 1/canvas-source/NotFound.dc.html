<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap');
    :root{
      --bg:#F3F5F7; --surface:#FFFFFF; --border:#DFE4EA; --border-strong:#C7CFD8;
      --text:#16202B; --text-2:#56677A; --text-3:#8A97A6;
      --accent:#0B6E8C; --accent-hover:#075169;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }
    button{ font-family:inherit; cursor:pointer; }
    button:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
    .primary-btn:hover{ background:var(--accent-hover); }
    .secondary-link:hover{ color:var(--accent-hover); text-decoration:underline; }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:var(--bg); display:flex; align-items:center; justify-content:center;">
  <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px;">
    <div style="width:36px; height:36px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 3-9 2 4h5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:56px; font-weight:600; color:var(--border-strong); letter-spacing:0.02em;">404</div>
    <div style="font-size:18px; font-weight:600;">Page not found</div>
    <div style="font-size:13px; color:var(--text-2); max-width:340px; line-height:19px;">The page you're looking for doesn't exist or may have moved.</div>
    <button class="primary-btn" style="margin-top:8px; height:38px; padding:0 18px; border-radius:6px; border:none; background:var(--accent); color:white; font-size:13px; font-weight:600;">Back to Dashboard</button>
    <button type="button" class="secondary-link" style="font-size:12px; color:var(--text-2); cursor:pointer; background:none; border:none; padding:0; font-family:inherit;">or return to sign in</button>
  </div>
</div>
</x-dc>
</body>
</html>
