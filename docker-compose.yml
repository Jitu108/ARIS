services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?SQLSERVER_SA_PASSWORD must be set in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  identity-service:
    build:
      context: .
      dockerfile: src/Services/IdentityService/aris.IdentityService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__PrivateKeyPem: ${JWT_SIGNING_KEY:-}
    ports:
      - "5146:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  aris-web:
    build:
      context: ./apps/aris-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
